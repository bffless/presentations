handler: ./wellKnown.fn.js
cases:
  - name: derives the resource and the admin authorization server from x-forwarded-host
    data: { request: { headers: { x-forwarded-host: "rag.bffless.dev", host: "localhost:3000" } } }
    expect:
      result:
        ok: true
        json: '{"resource":"https://rag.bffless.dev/api/mcp","authorization_servers":["https://admin.bffless.dev"],"scopes_supported":["images:generate"],"bearer_methods_supported":["header"],"resource_name":"Presentations images","resource_documentation":"https://github.com/bffless/presentations/blob/main/docs/plans/2026-09-06-images-mcp-layout.md"}'
  - name: falls back to host, takes the first of a comma list, and keeps a single-label host
    data: { request: { headers: { Host: "localhost:3000, other" } } }
    expect:
      result:
        ok: true
        json: '{"resource":"https://localhost:3000/api/mcp","authorization_servers":["https://localhost:3000"],"scopes_supported":["images:generate"],"bearer_methods_supported":["header"],"resource_name":"Presentations images","resource_documentation":"https://github.com/bffless/presentations/blob/main/docs/plans/2026-09-06-images-mcp-layout.md"}'
  - name: no host → not ok
    data: { request: { headers: {} } }
    expect:
      result: { ok: false, json: '{"error":"no_host","message":"the request names no host"}' }
