handler: ./prep.fn.js
cases:
  - name: prompt only — defaults to 16:9 and no reference images
    data: { request: { body: { prompt: "  a hero image  " } } }
    expect: { result: { ok: true, error: "", prompt: "a hero image", aspectRatio: "16:9", images: [] } }
  - name: accepts a listed aspect ratio and https references
    data: { request: { body: { prompt: "x", aspect_ratio: "1:1", reference_images: ["https://a/1.png", "https://b/2.jpg"] } } }
    expect: { result: { ok: true, error: "", prompt: "x", aspectRatio: "1:1", images: ["https://a/1.png", "https://b/2.jpg"] } }
  - name: refuses a missing prompt
    data: { request: { body: {} } }
    expect: { result: { ok: false, error: "prompt is required", prompt: "", aspectRatio: "16:9", images: [] } }
  - name: refuses an unlisted aspect ratio
    data: { request: { body: { prompt: "x", aspect_ratio: "5:4" } } }
    expect: { result: { ok: false, error: "aspect_ratio must be one of 16:9, 9:16, 1:1, 4:3, 3:4, 3:2, 2:3, 21:9", prompt: "x", aspectRatio: "5:4", images: [] } }
  - name: refuses a non-https reference image
    data: { request: { body: { prompt: "x", reference_images: ["http://a/1.png"] } } }
    expect: { result: { ok: false, error: "reference_images must be https:// URLs", prompt: "x", aspectRatio: "16:9", images: [] } }
  - name: refuses more than three reference images
    data: { request: { body: { prompt: "x", reference_images: ["https://a/1", "https://a/2", "https://a/3", "https://a/4"] } } }
    expect: { result: { ok: false, error: "at most 3 reference_images", prompt: "x", aspectRatio: "16:9", images: [] } }
  - name: refuses an over-long prompt
    data: { request: { body: { prompt: "" } } }
    expect: { result: { ok: false, error: "prompt is longer than 2000 characters", prompt: "", aspectRatio: "16:9", images: [] } }
